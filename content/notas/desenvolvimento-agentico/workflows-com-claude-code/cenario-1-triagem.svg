<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="c1">
  <title id="c1">Triagem: um leitor classifica e deduplica antes de qualquer handler agir</title>
  <style>
    :root{--ink:#2f2f2c;--muted:#87877f;--line:#c9c9c1;--accent:#bf6647;--fill:#dedcd4;}
    @media (prefers-color-scheme: dark){
      :root{--ink:#e9e8e3;--muted:#9a9a92;--line:#4d4d47;--accent:#e08a66;--fill:#3f3f39;}
    }
    text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;fill:var(--ink)}
    .in{font-size:11.5px;font-weight:600;text-anchor:middle}
    .cap{font-size:11.5px;fill:var(--muted);text-anchor:middle}
    .capl{font-size:12px;fill:var(--muted)}
    .acx{font-size:11.5px;font-weight:700;fill:var(--accent);text-anchor:middle}
    .node{fill:var(--fill);stroke:var(--line);stroke-width:1.4}
    .nodeA{fill:none;stroke:var(--accent);stroke-width:2}
    .plain{fill:none;stroke:var(--line);stroke-width:1.4}
    .ln{fill:none;stroke:var(--muted);stroke-width:1.4;marker-end:url(#ar)}
    .lnA{fill:none;stroke:var(--accent);stroke-width:1.8;marker-end:url(#arA)}
    .lnD{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 3;marker-end:url(#arD)}
    .ghost{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 3}
    .hair{stroke:var(--line);stroke-width:1.4}
  </style>
  <defs>
    <marker id="ar"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
  </defs>
  <rect class="node" x="24" y="44" width="64" height="16" rx="3"/>
  <rect class="node" x="24" y="66" width="64" height="16" rx="3"/>
  <rect class="node" x="24" y="88" width="64" height="16" rx="3"/>
  <rect class="node" x="24" y="110" width="64" height="16" rx="3"/>
  <text class="cap" x="56" y="148">tickets</text>

  <path class="ln" d="M92 85 L 120 85"/>
  <circle class="node" cx="148" cy="85" r="22"/>
  <text class="cap" x="148" y="126">leitor</text>
  <path class="ln" d="M172 85 L 204 85"/>
  <polygon class="node" points="232,65 252,85 232,105 212,85"/>
  <text class="cap" x="232" y="126">já existe?</text>

  <path class="lnA" d="M252 80 L 312 47"/>
  <path class="ln"  d="M252 84 L 312 92"/>
  <path class="ln"  d="M252 90 L 312 139"/>
  <path class="ln"  d="M252 94 L 312 187"/>

  <rect class="nodeA" x="320" y="28" width="124" height="34" rx="5"/><text class="acx" x="382" y="50">bug</text>
  <rect class="node"  x="320" y="76" width="124" height="34" rx="5"/><text class="in"  x="382" y="98">reembolso</text>
  <rect class="node"  x="320" y="124" width="124" height="34" rx="5"/><text class="in" x="382" y="146">lead</text>
  <rect class="node"  x="320" y="172" width="124" height="34" rx="5"/><text class="in" x="382" y="194">spam</text>

  <path class="lnA" d="M448 45 L 484 45"/>
  <circle class="nodeA" cx="510" cy="45" r="22"/>
  <text class="cap" x="510" y="86">handler</text>
  <path class="lnA" d="M534 45 L 566 45"/>
  <rect class="node" x="572" y="30" width="100" height="30" rx="5"/>
  <text class="in" x="622" y="50">ação</text>

  <text class="capl" x="24" y="240">a classificação é quarentena: só o que passou por ela chega em quem tem poder de agir</text>
</svg>

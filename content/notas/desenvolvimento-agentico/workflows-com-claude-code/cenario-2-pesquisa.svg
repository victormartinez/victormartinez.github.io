  <path class="lnA" d="M308 170 C 420 160, 470 136, 552 120"/>
  <path class="lnA" d="M308 206 C 420 190, 470 150, 552 126"/>

  <rect class="node" x="562" y="52" width="150" height="116" rx="6"/>
  <path class="hair" d="M582 78 L 692 78"/>
  <path class="hair" d="M582 100 L 692 100"/>
  <path class="hair" d="M582 122 L 692 122"/>
  <path class="hair" d="M582 144 L 660 144"/>
  <text class="cap" x="637" y="190">relatório sintetizado</text>

  <text class="capl" x="24" y="240">uma lente por agente, cada uma em contexto limpo — e todo achado volta com o caminho do arquivo</text>
</svg>

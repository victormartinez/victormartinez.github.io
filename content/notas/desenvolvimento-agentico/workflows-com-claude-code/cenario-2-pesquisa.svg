  <path class="ln" d="M192 206 L 242 206"/>

  <rect class="plain" x="248" y="13" width="58" height="26" rx="4"/>
  <rect class="plain" x="248" y="49" width="58" height="26" rx="4"/>
  <rect class="plain" x="248" y="85" width="58" height="26" rx="4"/>
  <rect class="plain" x="248" y="121" width="58" height="26" rx="4"/>
  <rect class="plain" x="248" y="157" width="58" height="26" rx="4"/>
  <rect class="plain" x="248" y="193" width="58" height="26" rx="4"/>

  <path class="lnA" d="M308 26  C 420 40, 470 80, 552 96"/>
  <path class="lnA" d="M308 62  C 420 70, 470 88, 552 102"/>
  <path class="lnA" d="M308 98  C 420 100, 470 104, 552 108"/>

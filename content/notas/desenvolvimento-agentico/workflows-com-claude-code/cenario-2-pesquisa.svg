<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="c2">
  <title id="c2">Pesquisa: uma pergunta abre em várias lentes, cada agente num contexto limpo, e tudo converge num relatório com citações</title>
  <style>
    :root{--ink:#2f2f2c;--muted:#87877f;--line:#c9c9c1;--accent:#bf6647;--fill:#dedcd4;}
    @media (prefers-color-scheme: dark){
      :root{--ink:#e9e8e3;--muted:#9a9a92;--line:#4d4d47;--accent:#e08a66;--fill:#3f3f39;}
    }
    text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;fill:var(--ink)}
    .in{font-size:11.5px;font-weight:600;text-anchor:middle}
    .cap{font-size:11.5px;fill:var(--muted);text-anchor:middle}
    .capl{font-size:12px;fill:var(--muted)}
    .acx{font-size:11.5px;font-weight:700;fill:var(--accent);text-anchor:middle}
    .node{fill:var(--fill);stroke:var(--line);stroke-width:1.4}
    .nodeA{fill:none;stroke:var(--accent);stroke-width:2}
    .plain{fill:none;stroke:var(--line);stroke-width:1.4}
    .ln{fill:none;stroke:var(--muted);stroke-width:1.4;marker-end:url(#ar)}
    .lnA{fill:none;stroke:var(--accent);stroke-width:1.8;marker-end:url(#arA)}
    .lnD{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 3;marker-end:url(#arD)}
    .ghost{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 3}
    .hair{stroke:var(--line);stroke-width:1.4}
  </style>
  <defs>
    <marker id="ar"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
  </defs>
  <text x="26" y="128" style="font-size:58px;font-weight:700;fill:var(--accent)">?</text>
  <text class="cap" x="44" y="156">pergunta</text>

  <path class="ln" d="M70 96 L 160 28"/>
  <path class="ln" d="M72 102 L 160 64"/>
  <path class="ln" d="M74 108 L 160 100"/>
  <path class="ln" d="M74 116 L 160 136"/>
  <path class="ln" d="M72 122 L 160 172"/>
  <path class="ln" d="M70 128 L 160 208"/>

  <circle class="node" cx="176" cy="26" r="14"/>
  <circle class="node" cx="176" cy="62" r="14"/>
  <circle class="node" cx="176" cy="98" r="14"/>
  <circle class="node" cx="176" cy="134" r="14"/>
  <circle class="node" cx="176" cy="170" r="14"/>
  <circle class="node" cx="176" cy="206" r="14"/>

  <path class="ln" d="M192 26 L 242 26"/>

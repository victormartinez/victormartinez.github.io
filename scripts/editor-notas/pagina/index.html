<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- O CSS do site vem primeiro: a prévia usa as mesmas classes das páginas
         de nota e de texto, então o que aparece nela é o que vai para o ar. -->
    <link rel="stylesheet" href="/site.css" />
    <link rel="stylesheet" href="/editor.css" />
  </head>
  <body class="ed">
    <header class="ed-topo">
      <p class="ed-marca">
        <svg class="ed-marca__peca" viewBox="0 0 36 23" aria-hidden="true">
          <rect x="5" y="0" width="9" height="5" rx="2" />
          <rect x="22" y="0" width="9" height="5" rx="2" />
          <rect x="0" y="5" width="36" height="18" rx="3" />
        </svg>
        vcrmartinez.com
        <span class="ed-marca__onde">editor local</span>
      </p>

      <div class="ed-status" id="status" data-estado="ocioso" role="status" aria-live="polite">
        <span class="ed-status__peca" aria-hidden="true"><i></i><i></i></span>
        <span class="ed-status__texto" id="status-texto">Nada aberto</span>
      </div>
    </header>

    <div class="ed-corpo">
      <aside class="ed-lateral" aria-label="Conteúdo">
        <div class="ed-colecoes" role="group" aria-label="O que editar">
          <button type="button" data-colecao="notas">Notas</button>
          <button type="button" data-colecao="textos">Textos</button>
        </div>
        <button type="button" class="botao ed-nova" id="nova">Nova nota</button>
        <input type="search" class="ed-busca" id="busca" autocomplete="off" />
        <nav class="ed-arvore" id="arvore"></nav>
      </aside>

      <main class="ed-principal">
        <section class="ed-inicio" id="inicio">
          <h1>Escreva, que o resto é com o editor.</h1>
          <p id="inicio-texto">
            Tudo o que você digita é gravado um instante depois — não existe
            botão de salvar. Imagens você cola, arrasta ou escolhe no botão
            Imagem: o editor cuida de onde elas ficam e do tamanho.
          </p>
          <button type="button" class="botao" id="nova-inicio">Nova nota</button>
        </section>

        <form class="ed-nota" id="nota" hidden autocomplete="off">
          <div class="ed-aviso" id="aviso" hidden role="alert"></div>

          <div class="ed-cabeca">
            <nav class="ed-trilha" id="trilha" aria-label="Onde fica"></nav>
            <input class="ed-titulo" id="titulo" aria-label="Título" placeholder="Título" />
            <input class="ed-descricao" id="descricao" aria-label="Descrição" />

            <div class="ed-meta">
              <!-- só nas notas -->
              <fieldset class="ed-estagio" data-so="notas">
                <legend>Estágio</legend>
                <label><input type="radio" name="maturidade" value="em-aberto" /><span class="selo selo--em-aberto">Em aberto</span></label>
                <label><input type="radio" name="maturidade" value="revisada" /><span class="selo selo--revisada">Revisada</span></label>
              </fieldset>
              <label class="ed-campo" data-so="notas">
                Ordem
                <input type="number" id="ordem" inputmode="numeric" step="1" placeholder="A–Z" />
              </label>
              <label class="ed-chave" data-so="notas">
                <input type="checkbox" id="publicado" role="switch" />
                <span>No site</span>
              </label>

              <!-- só nos textos -->
              <label class="ed-campo" data-so="textos">
                Data
                <input type="date" id="data" required />
              </label>
              <label class="ed-campo" data-so="textos">
                Categoria
                <input id="categoria" list="categorias" placeholder="Engenharia" />
                <datalist id="categorias"></datalist>
              </label>
              <label class="ed-chave ed-chave--publicar" data-so="textos">
                <input type="checkbox" id="publicado-texto" role="switch" />
                <span id="publicado-texto-rotulo">Rascunho</span>
              </label>

              <div class="ed-acoes">
                <button type="button" class="ed-sub" id="sub-nota" data-so="notas">Nova sub-nota</button>
                <a class="ed-sub" id="ver-no-site" target="_blank" rel="noopener"
                  title="Abre a página no make dev (localhost:8000)">Ver no site</a>
              </div>
            </div>
          </div>

          <div class="ed-barra">
            <div class="ed-modos" role="group" aria-label="Como mostrar">
              <button type="button" data-modo="escrever">Escrever</button>
              <button type="button" data-modo="dividir">Lado a lado</button>
              <button type="button" data-modo="previa">Prévia</button>
            </div>
            <button type="button" class="ed-imagem" id="botao-imagem">
              <svg viewBox="0 0 20 16" aria-hidden="true"><rect x="1" y="1" width="18" height="14" rx="2" /><circle cx="6.5" cy="5.5" r="1.8" /><path d="M1.5 13.5 7 8.5l3.5 3 3-2.5 5 4.5" /></svg>
              Imagem
            </button>
            <input type="file" id="arquivo-imagem" accept="image/*" multiple hidden />
          </div>

          <div class="ed-area" id="area" data-modo="dividir">
            <textarea
              id="corpo"
              class="ed-fonte"
              aria-label="Texto em Markdown"
              spellcheck="true"
              placeholder="Escreva aqui. Para uma imagem, cole, arraste ou use o botão Imagem."
            ></textarea>
            <div class="ed-previa pagina">
              <div class="post__corpo" id="previa"></div>
            </div>
            <div class="ed-dica" id="dica" hidden>
              <p id="dica-texto" role="status" aria-live="polite"></p>
              <div class="ed-dica__alt" id="dica-alt" hidden>
                <input id="dica-campo" aria-label="O que a imagem mostra"
                  placeholder="Ex.: o fluxo do pedido, do cliente até a fila" />
                <button type="button" class="botao" id="dica-pronto">Pronto</button>
                <button type="button" class="botao botao--nevoa" id="dica-pular">Agora não</button>
              </div>
            </div>
          </div>
        </form>
      </main>
    </div>

    <dialog class="ed-dialogo" id="dialogo-nova">
      <form method="dialog" id="form-nova">
        <h2 id="nova-titulo-dialogo">Nova nota</h2>
        <label class="ed-campo ed-campo--bloco" data-so="notas">
          Dentro de
          <select id="nova-pai"></select>
        </label>
        <label class="ed-campo ed-campo--bloco">
          Título
          <input id="nova-titulo" required />
        </label>
        <label class="ed-campo ed-campo--bloco" data-so="textos">
          Categoria
          <input id="nova-categoria" list="categorias" placeholder="Engenharia" />
        </label>
        <label class="ed-campo ed-campo--bloco">
          Endereço
          <input id="nova-slug" placeholder="gerado a partir do título" pattern="[a-z0-9]+(-[a-z0-9]+)*" />
        </label>
        <p class="ed-dialogo__url" id="nova-url"></p>
        <p class="ed-dialogo__erro" id="nova-erro" role="alert"></p>
        <div class="ed-dialogo__botoes">
          <button type="button" class="botao botao--nevoa" id="nova-cancelar">Cancelar</button>
          <button type="submit" class="botao" id="nova-criar">Criar nota</button>
        </div>
      </form>
    </dialog>

    <script src="/editor.js" type="module"></script>
  </body>
</html>

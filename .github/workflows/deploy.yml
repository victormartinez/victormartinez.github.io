name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages@v4+ resolve o artefato pelo id e precisa ler a API de Actions.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          # sharp e lmdb precisam rodar install scripts
          NPM_CONFIG_IGNORE_SCRIPTS: "false"

      - uses: actions/configure-pages@v6

      - name: Build do Gatsby
        run: npm run build
        env:
          GATSBY_GA4_ID: ${{ vars.GATSBY_GA4_ID }}
          NODE_ENV: production
          CI: "true"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          # A partir da v4 esta action descarta arquivos ocultos. O build gera
          # `public/.nojekyll` (vem de `static/`), então sem isto o artefato
          # deixaria de ser idêntico ao de hoje.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
